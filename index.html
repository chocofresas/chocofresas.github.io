/* ============================================================
   PANTALLA: REPORTES COMPARATIVOS (solo administrador)
   Compara dos periodos (día, semana, mes o año): cuánto se
   ingresó (ventas), cuánto se egresó (gastos + sueldos pagados +
   obras) y cuánto quedó libre, todo en $ y en Bs.
   ============================================================ */
var REP_TIPOS = [
  ['dia', 'Día vs día', 'date'],
  ['semana', 'Semana vs semana', 'date'],
  ['mes', 'Mes vs mes', 'month'],
  ['anio', 'Año vs año', 'number']
];

// Periodo "actual" (cual = 0) o "anterior" (cual = 1) para cada tipo.
function repPeriodo(tipo, cual) {
  var hoy = new Date();
  var fDM = function (d) {
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd = ('0' + d.getDate()).slice(-2);
    return d.getFullYear() + '-' + m + '-' + dd;
  };
  if (tipo === 'dia') {
    var d = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() - cual);
    return fDM(d);
  }
  if (tipo === 'semana') {
    var ds = hoy.getDay(), off = ds === 0 ? -6 : 1 - ds;
    var lun = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate() + off - cual * 7);
    return fDM(lun);
  }
  if (tipo === 'mes') {
    var m2 = new Date(hoy.getFullYear(), hoy.getMonth() - cual, 1);
    return m2.getFullYear() + '-' + ('0' + (m2.getMonth() + 1)).slice(-2);
  }
  return String(hoy.getFullYear() - cual);
}

render.reportes = async function () {
  pintar(
    '<div class="tarjeta"><h2>📊 Reportes comparativos</h2>' +
    '<p class="muted">Compara dos periodos: cuánto ingresaste, cuánto egresaste y cuánto quedó libre del negocio, en dólares ($) y bolívares (Bs).</p>' +
    '<label class="campo">Comparar por</label>' +
    '<select id="rep-tipo">' + REP_TIPOS.map(function (t) {
      return '<option value="' + t[0] + '"' + (t[0] === 'mes' ? ' selected' : '') + '>' + t[1] + '</option>';
    }).join('') + '</select>' +
    '<div class="form-2col" style="margin-top:4px">' +
    '<div><label class="campo" id="rep-lab-a">Periodo A</label><input id="rep-a"></div>' +
    '<div><label class="campo" id="rep-lab-b">Periodo B</label><input id="rep-b"></div>' +
    '</div>' +
    '<div class="fila-botones">' +
    '<button class="btn btn-primario" id="rep-go">Generar comparación</button>' +
    '<button class="btn" id="rep-recientes">↻ Actual vs anterior</button>' +
    '</div></div>' +
    '<div id="rep-res"><div class="cargando">Calculando…</div></div>'
  );
  var res = el('rep-res');
  function configInputs() {
    var t = el('rep-tipo').value;
    var ta = REP_TIPOS.find(function (x) { return x[0] === t; });
    var a = el('rep-a'), b = el('rep-b');
    a.type = ta[2]; b.type = ta[2];
    a.value = repPeriodo(t, 0);
    b.value = repPeriodo(t, 1);
    if (ta[2] === 'number') { a.min = 2000; a.max = 2100; a.step = 1; b.min = 2000; b.max = 2100; b.step = 1; }
    if (t === 'dia') { el('rep-lab-a').textContent = 'Día A'; el('rep-lab-b').textContent = 'Día B (anterior)'; }
    else if (t === 'semana') {
      el('rep-lab-a').textContent = 'Semana A (cualquier día)';
      el('rep-lab-b').textContent = 'Semana B (cualquier día)';
    }
    else if (t === 'mes') { el('rep-lab-a').textContent = 'Mes A'; el('rep-lab-b').textContent = 'Mes B (anterior)'; }
    else { el('rep-lab-a').textContent = 'Año A'; el('rep-lab-b').textContent = 'Año B (anterior)'; }
  }
  async function generar() {
    var t = el('rep-tipo').value;
    var a = el('rep-a').value.trim();
    var b = el('rep-b').value.trim();
    if (!a || !b) { toast('Indica los dos periodos a comparar.', 'error'); return; }
    if (a === b) { toast('Los dos periodos son iguales: elige dos distintos.', 'error'); return; }
    res.innerHTML = '<div class="cargando">Calculando…</div>';
    try {
      var r = await API.reporteComparativo(t, a, b);
      if (S.pagina !== 'reportes') return; // el usuario ya cambió de pantalla
      pintarReporte(r);
    } catch (e) {
      if (S.pagina !== 'reportes') return;
      res.innerHTML = '<div class="tarjeta"><div class="aviso aviso-error">' + esc((e && e.message) || 'No se pudo generar el reporte.') + '</div></div>';
    }
  }
  el('rep-a').addEventListener('keydown', function (e) { if (e.key === 'Enter') generar(); });
  el('rep-b').addEventListener('keydown', function (e) { if (e.key === 'Enter') generar(); });
  el('rep-tipo').addEventListener('change', function () { configInputs(); generar(); });
  el('rep-go').addEventListener('click', generar);
  el('rep-recientes').addEventListener('click', function () { configInputs(); generar(); });
  configInputs();
  generar(); // muestra de entrada el periodo actual vs el anterior
};

function pintarReporte(r) {
  var A = r.A, B = r.B, res = el('rep-res');
  if (!res) return;
  function repLinea(nombre, usd, ves, cl) {
    return '<div class="d-lin"><span>' + nombre + '</span>' +
      '<span class="negrita' + (cl ? ' ' + cl : '') + '">' + fmtUSD(usd) + '<small class="rep-bs"> (' + fmtVES(ves) + ')</small></span></div>';
  }
  function bloq(p, letra) {
    return '<div class="tarjeta rep-per"><div class="rep-per-cab">' + letra + ' · ' + esc(p.etiqueta) + '</div>' +
      '<div class="detalle-venta">' +
      repLinea('💵 Ventas (ingreso)', p.ingreso_usd, p.ingreso_ves, 'k-verde') +
      repLinea('💸 Egresos', p.egreso_usd, p.egreso_ves, 'k-rojo') +
      repLinea('🧮 Quedó libre', p.libre_usd, p.libre_ves, p.libre_usd < 0 ? 'k-rojo' : 'k-azul') +
      '</div>' +
      '<p class="muted" style="margin-top:8px">' + p.ventas + ' ventas · ' + p.gastos + ' gastos · ' +
      p.sueldos + ' sueldos · ' + p.obras + ' gastos de obras' +
      (p.tasa ? ' · tasa media Bs ' + fmtNum(p.tasa) : '') + '</p></div>';
  }
  function celda(usd, ves, conSigno, cl) {
    return '<td class="der">' +
      '<div class="rep-monto' + (cl ? ' ' + cl : '') + '">' + (conSigno && usd >= 0 ? '+' : '') + fmtUSD(usd) + '</div>' +
      '<div class="rep-monto rep-bs' + (cl ? ' ' + cl : '') + '">' + (conSigno && ves >= 0 ? '+' : '') + fmtVES(ves) + '</div></td>';
  }
  var filas = [
    { n: 'Ventas (ingreso)', aU: num(A.ingreso_usd), aV: num(A.ingreso_ves), bU: num(B.ingreso_usd), bV: num(B.ingreso_ves), clA: '', clB: '' },
    { n: 'Gastos', aU: num(A.gastos_usd), aV: num(A.gastos_usd) * num(A.tasa), bU: num(B.gastos_usd), bV: num(B.gastos_usd) * num(B.tasa) },
    { n: 'Sueldos pagados', aU: num(A.sueldos_usd), aV: num(A.sueldos_usd) * num(A.tasa), bU: num(B.sueldos_usd), bV: num(B.sueldos_usd) * num(B.tasa) },
    { n: 'Gastos de obras', aU: num(A.obras_usd), aV: num(A.obras_usd) * num(A.tasa), bU: num(B.obras_usd), bV: num(B.obras_usd) * num(B.tasa) },
    { n: '💸 Total egresos', aU: num(A.egreso_usd), aV: num(A.egreso_ves), bU: num(B.egreso_usd), bV: num(B.egreso_ves), clA: 'k-rojo', clB: 'k-rojo' },
    { n: '🧮 Quedó libre', aU: num(A.libre_usd), aV: num(A.libre_ves), bU: num(B.libre_usd), bV: num(B.libre_ves), clA: num(A.libre_usd) < 0 ? 'k-rojo' : 'k-azul', clB: num(B.libre_usd) < 0 ? 'k-rojo' : 'k-azul' }
  ];
  var dLib = num(B.libre_usd) - num(A.libre_usd);
  var dLibVes = num(B.libre_ves) - num(A.libre_ves);
  var balCl = Math.abs(dLib) < 0.005 ? 'muted' : (dLib > 0 ? 'k-verde' : 'k-rojo');
  res.innerHTML =
    '<div class="grid-cards" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))">' + bloq(A, 'A') + bloq(B, 'B') + '</div>' +
    '<div class="tarjeta" style="margin-top:14px"><h2>⚖️ Comparación</h2>' +
    '<div class="tabla-envoltura" style="margin-top:8px"><table class="tabla" style="min-width:560px"><thead><tr>' +
    '<th>Concepto</th><th class="der">Periodo A</th><th class="der">Periodo B</th><th class="der">Diferencia (B − A)</th>' +
    '</tr></thead><tbody>' +
    filas.map(function (f) {
      var dU = f.bU - f.aU, dV = f.bV - f.aV;
      var clD = Math.abs(dU) < 0.005 ? '' : (dU > 0 ? 'k-verde' : 'k-rojo');
      return '<tr>' +
        '<td class="negrita">' + f.n + '</td>' +
        celda(f.aU, f.aV, false, f.clA) +
        celda(f.bU, f.bV, false, f.clB) +
        celda(dU, dV, true, clD) +
        '</tr>';
    }).join('') +
    '</tbody></table></div>' +
    '<div class="fila-entre" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--borde)">' +
    '<span class="negrita">Balance del periodo B vs A</span>' +
    '<span class="negrita ' + balCl + '">' +
    (dLib >= 0 ? 'Quedó libre ' + fmtUSD(dLib) + ' MÁS' : 'Quedó libre ' + fmtUSD(Math.abs(dLib)) + ' MENOS') +
    '<small class="rep-bs"> (' + fmtVES(Math.abs(dLibVes)) + ')</small></span></div>' +
    '<p class="muted" style="margin-top:8px">Los Bs de egresos se convierten con la tasa media de cada periodo' +
    ' (A: 1 $ = Bs ' + fmtNum(A.tasa) + ' · B: 1 $ = Bs ' + fmtNum(B.tasa) + ').' +
    ' Los Bs de ventas son los reales con los que se cobró.</p>' +
    '</div>';
}

    chks += '<label style="display:flex;align-items:center;gap:4px;background:#f4f4f5;border-radius:8px;padding:6px 10px;font-size:13px">' +
      '<input type="checkbox" class="em-dia" value="' + n + '" style="width:auto"' + (on ? ' checked' : '') + '>' + DIAS_CORTOS[n] + '</label>';
  }

    '</div>' +
    '<label class="campo">Días que trabaja</label>' +

    '<label class="campo"><input type="checkbox" id="em-act" style="width:auto"' + (String(v.activo) !== '0' ? ' checked' : '') + '> Activo</label>' +
    '<div class="modal-acciones"><button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +

}

// Modal de pago: lista los días pendientes con casilla (marcado = se paga).
// Los días que se desmarcan quedan como "no trabajó" (no se cobran).
function formularioPagoSueldo(emp) {
  if (!emp) return;
  API.diasPendientes(emp.id).then(function (lista) {
    lista = (lista || []).slice();
    if (!lista.length) { toast('Ese empleado no tiene días pendientes', 'error'); return; }
    var total = lista.reduce(function (a, x) { return a + num(x.monto_usd); }, 0);
    var filas = lista.map(function (d) {
      var etq = d.fecha_dia ? etiquetaFechaCorta(d.fecha_dia) : ('Periodo ' + (d.periodo || '') + ' (registro anterior)');
      return '<label style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-bottom:1px solid #eee">' +
        '<span style="display:flex;align-items:center;gap:8px"><input type="checkbox" class="pg-dia" value="' + esc(d.id) + '" data-monto="' + num(d.monto_usd) + '" checked style="width:auto"> ' + esc(etq) + '</span>' +
        '<b>' + fmtUSD(d.monto_usd) + '</b></label>';
    }).join('');
    abrirModal(
      '<div class="modal-tope"><h3>Pagar sueldo · ' + esc(emp.nombre) + '</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
      '<p class="muted" style="margin:4px 0 8px">Desmarca los días que <b>no trabajó</b>: esos no se cobran.</p>' +
      '<div style="max-height:46vh;overflow:auto;border:1px solid #eee;border-radius:10px">' + filas + '</div>' +
      '<div class="fila-entre" style="margin-top:10px"><strong>Total a pagar</strong><strong id="pg-total" class="k-verde">' + fmtUSD(total) + '</strong></div>' +
      '<div class="modal-acciones"><button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
      '<button class="btn btn-primario" id="pg-guardar">Registrar pago</button></div>'
    );
    function recalcular() {
      var t = 0;
      Array.prototype.forEach.call(document.querySelectorAll('.pg-dia'), function (c) { if (c.checked) t += num(c.getAttribute('data-monto')); });
      el('pg-total').textContent = fmtUSD(t);
    }
    Array.prototype.forEach.call(document.querySelectorAll('.pg-dia'), function (c) { c.addEventListener('change', recalcular); });
    el('pg-guardar').addEventListener('click', async function () {
      var pagar = [], falta = [];
      Array.prototype.forEach.call(document.querySelectorAll('.pg-dia'), function (c) { (c.checked ? pagar : falta).push(c.value); });
      if (!pagar.length && !falta.length) { toast('No hay días seleccionados', 'error'); return; }
      try {
        var r = await API.registrarPagoSueldo({ empleado_id: emp.id, pagar: pagar, falta: falta });
        cerrarModal();
        toast('Pago registrado: ' + fmtUSD((r && r.total_usd) || 0) + (falta.length ? ' · ' + falta.length + ' día(s) no trabajado(s)' : ''), 'ok');
        irA('nomina', { sub: 'sueldos' });
      } catch (err) { toast(err.message, 'error'); }
    });
  }).catch(function (e) { toast(e.message, 'error'); });
}

function etiquetaFechaCorta(f) {
  var p = String(f || '').slice(0, 10).split('-');
  if (p.length !== 3) return String(f || '');
  var d = new Date(parseInt(p[0], 10), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
  var dow = d.getDay();
  return DIAS_CORTOS[dow === 0 ? 7 : dow] + ' ' + ('0' + d.getDate()).slice(-2) + '/' + p[1];
}

function diasSemanaTexto(v) {
  var a = String(v == null ? '' : v).split(',').map(function (x) { return parseInt(x, 10); })
    .filter(function (n) { return n >= 1 && n <= 7; });
  if (!a.length) return '—';
  return a.map(function (n) { return DIAS_CORTOS[n]; }).join(' · ');
}

  if (gs === undefined) { gs = await API.listarRemodGastos(id).catch(function () { return []; }); cacheSet('remodgastos:' + id, gs); }
  var total = gs.reduce(function (a, g) { return a + num(g.monto_usd); }, 0);
  var admin = S.rol === 'admin';
  abrirModal(
    '<div class="modal-tope"><h3>' + esc(r.nombre) + '</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<p class="muted">' + esc(r.tipo || '') + ' · Inicio: ' + fechaCorta(r.fecha_inicio) + (r.fecha_fin_estimada ? ' · Fin est.: ' + fechaCorta(r.fecha_fin_estimada) : '') + '</p>' +
    '<div class="progreso"><div style="width:' + Math.min(100, num(r.progreso)) + '%"></div></div>' +

function qrURL(url, size) {
  var s = size || 300;
  return 'https://api.qrserver.com/v1/create-qr-code/?size=' + s + 'x' + s + '&margin=10&data=' + encodeURIComponent(url);
}

function copiarTexto(t) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(function () { toast('Enlace copiado ✅', 'ok'); }, function () { toast('Copia el enlace manualmente', 'error'); });
      return;
    }
  } catch (e) {}
  toast('Copia manualmente: ' + t, 'ok');
}

function imprimirQRMenu() {
  var w = window.open('', '_blank');
  if (!w) { toast('Permite las ventanas emergentes para imprimir el QR', 'error'); return; }
  w.document.write('<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>QR del menú — FresaChoco</title></head>' +
    '<body style="margin:0;font-family:system-ui,Arial,sans-serif;text-align:center;padding:36px 20px">' +
    '<h1 style="margin:0;color:#c2185b">🍓 FresaChoco</h1>' +
    '<h2 style="margin:6px 0 22px">Escanea para ver el menú y hacer tu pedido</h2>' +
    '<img src="' + qrURL(URL_MENU, 460) + '" width="360" height="360" alt="QR">' +
    '<p style="font-size:17px;margin-top:18px">' + esc(URL_MENU) + '</p>' +
    '<p style="color:#777">¡Te esperamos! 🍫🍦🍓</p>' +
    '</body></html>');
  w.document.close();
  w.focus();
  setTimeout(function () { try { w.print(); } catch (e) {} }, 500);
}

function pintarGridMenu(q) {
  var grid = el('mn-grid');
  if (!grid) return;
  var ql = (q || '').trim().toLowerCase();
  var lista = prods().filter(function (p) {
    return !ql || String(p.nombre).toLowerCase().indexOf(ql) >= 0 || String(p.codigo).toLowerCase().indexOf(ql) >= 0;
  });
  var enMenu = lista.filter(function (p) { return String(p.en_menu) !== '0'; });
  var fuera = lista.filter(function (p) { return String(p.en_menu) === '0'; });
  var res = el('mn-resumen');
  if (res) res.textContent = enMenu.length + ' en el menú · ' + fuera.length + ' ocultos';
  function tarjeta(p, visible) {
    var img = p.imagen
      ? '<img src="' + esc(p.imagen) + '" alt="' + esc(p.nombre) + '">'
      : '<div class="mc-sin">' + emojiDeProducto(p) + '</div>';
    return '<div class="menu-card' + (visible ? '' : ' oculto') + '">' +
      '<div class="mc-foto">' + img + '</div>' +
      '<div class="mc-cuerpo">' +
        '<div class="mc-nom"><span class="prod-emoji">' + emojiDeProducto(p) + '</span>' + esc(p.nombre) + '</div>' +
        '<div class="mc-cat muted">' + esc(p.categoria) + ' · ' + fmtUSD(p.precio_usd) +
          (num(p.topes_incluidos) > 0 ? ' · +' + fmtCant(p.topes_incluidos) + ' tope(s)' : '') +
          (p.disponibles !== '' && p.disponibles != null ? ' · cupo ' + fmtCant(p.disponibles) : '') +
        '</div>' +
        '<div class="mc-desc muted">' + (p.descripcion ? esc(p.descripcion) : '<i>Sin detalles</i>') + '</div>' +
        '<div class="mc-acc">' +
          '<button class="btn btn-suave" data-mn-edit="' + esc(p.codigo) + '">✏️ Foto y detalles</button>' +
          '<button class="btn' + (visible ? ' btn-suave' : ' btn-primario') + '" data-mn-toggle="' + esc(p.codigo) + '" data-est="' + (visible ? 0 : 1) + '">' + (visible ? '🙈 Ocultar' : '👁 Agregar') + '</button>' +
          '<button class="btn btn-suave" data-mn-del="' + esc(p.codigo) + '" title="Eliminar producto">🗑</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  grid.innerHTML = enMenu.map(function (p) { return tarjeta(p, true); }).join('') +
    (fuera.length ? '<div class="menu-sep">Fuera del menú</div>' + fuera.map(function (p) { return tarjeta(p, false); }).join('') : '');
  Array.prototype.forEach.call(grid.querySelectorAll('[data-mn-edit]'), function (b) {

      formularioProducto(p);
    });
  });
  Array.prototype.forEach.call(grid.querySelectorAll('[data-mn-toggle]'), function (b) {
    b.addEventListener('click', async function () {
      var cod = b.getAttribute('data-mn-toggle');
      var est = num(b.getAttribute('data-est'));
      b.disabled = true;
      try {
        await API.marcarEnMenu(cod, est);
        await cargarProductos();
        pintarGridMenu(el('mn-bus') ? el('mn-bus').value : '');
        toast(est ? 'Agregado al menú 📖' : 'Ocultado del menú', 'ok');

    });

  Array.prototype.forEach.call(grid.querySelectorAll('[data-mn-del]'), function (b) {

      var cod = b.getAttribute('data-mn-del');
      var p = prods().find(function (x) { return String(x.codigo) === cod; });
      if (!confirm('¿Eliminar «' + ((p && p.nombre) || cod) + '» del menú?\n\nDesaparece del menú y del inventario de productos. Los pedidos ya hechos no se pierden.')) return;
      b.disabled = true;
      try {
        await API.eliminarProducto(cod);
        await cargarProductos();
        pintarGridMenu(el('mn-bus') ? el('mn-bus').value : '');
        toast('Producto eliminado 🗑', 'ok');
      } catch (e) { toast((e && e.message) || 'No se pudo eliminar', 'error'); b.disabled = false; }
    });
  });
}

/* ---------- Administración de topes/toppings ---------- */
function modalToppings() {
  if (S.rol !== 'admin') { toast('Solo el administrador puede editar los topes.', 'error'); return; }
  function fila(t) {
    var esInc = String(t.tipo) === 'incluido';
    return '<div class="d-lin" style="align-items:center">' +
      '<span>' + (esInc ? '🎁 ' : '➕ ') + '<b>' + esc(t.nombre) + '</b><br><span class="muted mono">' + esc(t.codigo) + ' · ' + (esInc ? 'clásico (gratis)' : 'adicional ' + fmtUSD(t.precio_usd)) + '</span></span>' +
      '<span style="white-space:nowrap">' +
        '<button class="btn btn-suave" data-top-edit="' + esc(t.codigo) + '">✏️</button> ' +
        '<button class="btn btn-suave" data-top-del="' + esc(t.codigo) + '" title="Eliminar">🗑</button>' +
      '</span>' +
    '</div>';
  }
  var lista = toppings();
  var inc = lista.filter(function (t) { return String(t.tipo) === 'incluido'; });
  var add = lista.filter(function (t) { return String(t.tipo) !== 'incluido'; });
  abrirModal(
    '<div class="modal-tope"><h3>🍫 Topes / toppings</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<p class="muted" style="margin-top:0">Los <b>clásicos</b> van gratis dentro del cupo que cada vaso incluye. Los <b>adicionales</b> suman su precio a cada unidad.</p>' +
    '<button class="btn btn-primario btn-ancho" id="top-nuevo">＋ Nuevo tope</button>' +
    '<h4 style="margin:14px 0 4px">🎁 Clásicos incluidos</h4>' +
    '<div class="detalle-venta">' + (inc.length ? inc.map(fila).join('') : '<div class="muted">Sin topes clásicos.</div>') + '</div>' +
    '<h4 style="margin:14px 0 4px">➕ Adicionales (+ precio)</h4>' +
    '<div class="detalle-venta">' + (add.length ? add.map(fila).join('') : '<div class="muted">Sin adicionales.</div>') + '</div>'
  );
  el('top-nuevo').addEventListener('click', function () { formularioTopping(null); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-top-edit]'), function (b) {
    b.addEventListener('click', function () { formularioTopping(toppingPorCodigo(b.getAttribute('data-top-edit'))); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-top-del]'), function (b) {
    b.addEventListener('click', async function () {
      var t = toppingPorCodigo(b.getAttribute('data-top-del'));
      if (!confirm('¿Eliminar el tope «' + ((t && t.nombre) || '') + '»?')) return;
      try {
        await API.eliminarTopping(b.getAttribute('data-top-del'));
        _promTop = null; await cargarToppings();
        toast('Tope eliminado 🗑', 'ok');
        modalToppings();
      } catch (e) { toast((e && e.message) || 'No se pudo eliminar', 'error'); }
    });
  });
}

function formularioTopping(t) {
  var ed = !!t;
  var t0 = t || { codigo: '', nombre: '', tipo: 'adicional', precio_usd: 0.5, activo: 1 };
  abrirModal(
    '<div class="modal-tope"><h3>' + (ed ? '✏️ Editar tope' : '＋ Nuevo tope') + '</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<div id="t-error" class="aviso aviso-error" style="display:none"></div>' +
    '<label class="campo">Código</label><input id="t-cod" value="' + esc(t0.codigo) + '"' + (ed ? ' disabled' : '') + ' placeholder="TOP-...">' +
    '<label class="campo">Nombre</label><input id="t-nom" value="' + esc(t0.nombre) + '" placeholder="Lluvia de chocolate">' +
    '<label class="campo">Tipo</label><select id="t-tipo">' +
      '<option value="incluido"' + (String(t0.tipo) === 'incluido' ? ' selected' : '') + '>Clásico (incluido, gratis)</option>' +
      '<option value="adicional"' + (String(t0.tipo) !== 'incluido' ? ' selected' : '') + '>Adicional (+ precio)</option>' +
    '</select>' +
    '<div id="t-precio-wrap"><label class="campo">Precio adicional ($)</label><input id="t-precio" type="number" min="0" step="0.01" value="' + num(t0.precio_usd) + '"></div>' +
    '<div class="modal-acciones">' +
      '<button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
      '<button class="btn btn-primario" id="t-guardar">Guardar</button>' +
    '</div>'
  );
  function refrescarPrecio() {
    var w = el('t-precio-wrap');
    if (w) w.style.display = (el('t-tipo').value === 'incluido') ? 'none' : '';
  }
  refrescarPrecio();
  el('t-tipo').addEventListener('change', refrescarPrecio);
  el('t-guardar').addEventListener('click', async function () {
    var eb = el('t-error'); if (eb) { eb.style.display = 'none'; eb.textContent = ''; }
    var t2 = {
      codigo: el('t-cod').value.trim(),
      nombre: el('t-nom').value.trim(),
      tipo: el('t-tipo').value,
      precio_usd: num(el('t-precio').value),
      activo: 1
    };
    if (!t2.codigo || !t2.nombre) {
      if (eb) { eb.textContent = '⚠️ Escribe el código y el nombre.'; eb.style.display = 'block'; }
      return;
    }
    try {
      await API.guardarTopping(t2);
      _promTop = null; await cargarToppings();
      toast('Tope guardado 🍫', 'ok');
      modalToppings();
    } catch (e) {
      var M = (e && e.message) || 'No se pudo guardar.';
      if (eb) { eb.textContent = '⚠️ ' + M; eb.style.display = 'block'; }
      toast(M, 'error');
    }
  });
}

/* Selector de topes reutilizable (se usa al tomar un pedido). onOk(codigos[]). */
function elegirTopes(prod, iniciales, onOk) {
  var info = topesDisponibles(prod);
  if (!info.incluidos.length && !info.adicionales.length) { onOk([]); return; }
  var sel = (iniciales || []).slice();
  function contIncluidos() {
    return sel.filter(function (c) { var t = toppingPorCodigo(c); return t && String(t.tipo) === 'incluido'; });
  }
  function casilla(t, esInc) {
    var marcado = sel.indexOf(String(t.codigo)) >= 0;
    return '<label class="campo" style="display:flex;align-items:center;gap:8px;padding:4px 0">' +
      '<input type="checkbox" data-top-pick="' + esc(t.codigo) + '" style="width:auto"' + (marcado ? ' checked' : '') + '>' +
      '<span>' + esc(t.nombre) + (esInc ? ' <span class="muted">(incluido)</span>' : ' <b>+ ' + fmtUSD(t.precio_usd) + '</b>') + '</span>' +
      '</label>';
  }
  abrirModal(
    '<div class="modal-tope"><h3>🍫 Topes para «' + esc(prod.nombre) + '»</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    (info.incluidos.length
      ? '<p class="muted" style="margin-top:0">Elige hasta <b>' + info.max + '</b> clásico(s) incluido(s) sin costo.</p><div class="detalle-venta">' + info.incluidos.map(function (t) { return casilla(t, true); }).join('') + '</div>'
      : '') +
    (info.adicionales.length
      ? '<p class="muted" style="margin:10px 0 0">Adicionales (+ precio por unidad):</p><div class="detalle-venta">' + info.adicionales.map(function (t) { return casilla(t, false); }).join('') + '</div>'
      : '') +
    '<div id="top-pick-msg" class="aviso aviso-error" style="display:none;margin-top:8px"></div>' +
    '<div class="modal-acciones"><button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-primario" id="top-pick-ok">Aplicar topes</button></div>'
  );
  Array.prototype.forEach.call(document.querySelectorAll('[data-top-pick]'), function (cb) {
    cb.addEventListener('change', function () {
      var cod = cb.getAttribute('data-top-pick');
      if (cb.checked) { if (sel.indexOf(cod) < 0) sel.push(cod); }
      else sel = sel.filter(function (x) { return x !== cod; });
      var msg = el('top-pick-msg');
      if (msg) {
        if (info.max && contIncluidos().length > info.max) { msg.textContent = 'Solo puedes elegir ' + info.max + ' clásico(s) como incluidos.'; msg.style.display = 'block'; }
        else { msg.style.display = 'none'; }
      }
    });
  });
  el('top-pick-ok').addEventListener('click', function () {
    if (info.max && contIncluidos().length > info.max) { toast('Solo puedes elegir ' + info.max + ' clásico(s)', 'error'); return; }
    cerrarModal();
    onOk(sel);
  });
}

render.insumos = async function () {
  _promIns = null;
  await cargarInsumos();
  var esAdmin = S.rol === 'admin';
  pintar(
    '<div class="fila-botones" style="margin:0 0 8px">' +
      (esAdmin ? '<button class="btn btn-primario" id="ins-nuevo">＋ Nuevo insumo</button>' : '') +
      '<button class="btn" id="ins-reload">↻ Recargar</button>' +
    '</div>' +
    '<p class="muted" style="margin:0 0 10px">Materia prima del negocio. Al <b>despachar un pedido</b> se descuenta sola la cantidad que indique la receta de cada producto (se define en 📖 Menú).</p>' +
    '<div class="buscador"><input id="ins-bus" placeholder="Filtrar insumos…" autocomplete="off"></div>' +
    '<div id="ins-resumen" class="muted" style="margin:0 0 8px"></div>' +
    '<div id="ins-tabla"></div>'
  );
  if (esAdmin) el('ins-nuevo').addEventListener('click', function () { formularioInsumo(null); });
  el('ins-reload').addEventListener('click', async function () {
    _promIns = null; await cargarInsumos();
    pintarTablaInsumos(el('ins-bus') ? el('ins-bus').value : '');

  });
  el('ins-bus').addEventListener('input', function () { pintarTablaInsumos(this.value); });
  pintarTablaInsumos('');
};

function pintarTablaInsumos(q) {
  var cont = el('ins-tabla');
  if (!cont) return;
  if (S.errInsumos) {
    cont.innerHTML = '<div class="tarjeta" style="border-left:4px solid #c62828"><b>⚠️ No se pudieron cargar los insumos:</b> ' + esc(S.errInsumos) + '</div>';
    return;
  }
  var ql = (q || '').trim().toLowerCase();
  var lista = insumos().filter(function (i) {
    return !ql || String(i.nombre).toLowerCase().indexOf(ql) >= 0 || String(i.codigo).toLowerCase().indexOf(ql) >= 0;
  });
  var res = el('ins-resumen');
  if (res) res.textContent = lista.length + ' insumo' + (lista.length === 1 ? '' : 's');
  if (!lista.length) {
    cont.innerHTML = '<div class="tarjeta muted">No hay insumos.' + (S.rol === 'admin' ? ' Toca «＋ Nuevo insumo» para crear el primero (ej.: Fresas, Chocolate, Crema de leche).' : '') + '</div>';
    return;
  }
  var esAdmin = S.rol === 'admin';
  cont.innerHTML = '<div class="tabla-envoltura"><table class="tabla"><thead><tr>' +
    '<th>Código</th><th>Insumo</th><th>Unidad</th><th class="der">Stock</th><th class="der">Mín.</th><th class="der">Costo $</th>' + (esAdmin ? '<th>Acciones</th>' : '') +
    '</tr></thead><tbody>' +
    lista.map(function (i) {
      var stock = num(i.stock), min = num(i.stock_min);
      var activo = String(i.activo) !== '0';
      var baja = activo && stock <= min;
      var acc = esAdmin
        ? '<button class="btn btn-suave" style="padding:6px 10px" data-ins-aj="' + esc(i.codigo) + '">±Stock</button> ' +
          '<button class="btn" style="padding:6px 10px" data-ins-edit="' + esc(i.codigo) + '">✏️</button> ' +
          '<button class="btn btn-suave" style="padding:6px 10px" data-ins-del="' + esc(i.codigo) + '" title="Eliminar">🗑</button>'
        : '';
      return '<tr' + (activo ? '' : ' style="opacity:.45"') + '>' +
        '<td class="mono">' + esc(i.codigo) + '</td>' +
        '<td>' + esc(i.nombre) + (activo ? '' : '<br><small class="muted">Inactivo</small>') + '</td>' +
        '<td>' + esc(i.unidad || 'u') + '</td>' +
        '<td class="der' + (baja ? ' baja' : '') + '">' + fmtCant(stock) + (baja ? ' ⚠️' : '') + '</td>' +
        '<td class="der muted">' + fmtCant(min) + '</td>' +
        '<td class="der">' + fmtUSD(i.costo_usd) + '</td>' +
        (esAdmin ? '<td>' + acc + '</td>' : '') +
        '</tr>';
    }).join('') +
    '</tbody></table></div>';
  Array.prototype.forEach.call(cont.querySelectorAll('[data-ins-aj]'), function (b) {
    b.addEventListener('click', function () { formularioStockInsumo(b.getAttribute('data-ins-aj')); });
  });
  Array.prototype.forEach.call(cont.querySelectorAll('[data-ins-edit]'), function (b) {
    b.addEventListener('click', function () {
      var cod = b.getAttribute('data-ins-edit');
      formularioInsumo(insumos().find(function (x) { return String(x.codigo) === cod; }));
    });
  });
  Array.prototype.forEach.call(cont.querySelectorAll('[data-ins-del]'), function (b) {
    b.addEventListener('click', async function () {
      var cod = b.getAttribute('data-ins-del');
      var ins = insumos().find(function (x) { return String(x.codigo) === cod; });
      if (!confirm('¿Eliminar el insumo «' + ((ins && ins.nombre) || cod) + '»?')) return;
      b.disabled = true;
      try {
        await API.eliminarInsumo(cod);
        await cargarInsumos();
        pintarTablaInsumos(el('ins-bus') ? el('ins-bus').value : '');
        toast('Insumo eliminado 🗑', 'ok');
      } catch (e) { toast((e && e.message) || 'No se pudo eliminar', 'error'); b.disabled = false; }
    });
  });
}

function formularioInsumo(ins) {
  var ed = !!(ins && ins.codigo);
  var i = ins || { codigo: '', nombre: '', unidad: 'unidad', stock: 0, stock_min: 0, costo_usd: '', activo: 1 };
  var unidades = ['unidad', 'kg', 'g', 'litro', 'ml', 'caja', 'paquete', 'docena'];
  abrirModal(
    '<div class="modal-tope"><h3>' + (ed ? 'Editar insumo' : 'Nuevo insumo') + '</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<label class="campo">Código</label><input id="i-cod" value="' + esc(i.codigo) + '"' + (ed ? ' disabled' : '') + ' placeholder="ej: INS-FRESA">' +
    '<label class="campo">Nombre</label><input id="i-nom" value="' + esc(i.nombre) + '" placeholder="ej: Fresas">' +
    '<label class="campo">Unidad de medida</label>' +
    '<input id="i-uni" list="lst-uni" value="' + esc(i.unidad || 'unidad') + '">' +
    '<datalist id="lst-uni">' + unidades.map(function (u) { return '<option value="' + u + '">'; }).join('') + '</datalist>' +
    '<div class="form-2col">' +
    '<div><label class="campo">Stock actual</label><input id="i-stock" type="number" step="0.0001" value="' + esc(i.stock) + '"></div>' +
    '<div><label class="campo">Stock mínimo</label><input id="i-min" type="number" step="0.0001" value="' + esc(i.stock_min || 0) + '"></div>' +
    '<div><label class="campo">Costo ($) por unidad</label><input id="i-costo" type="number" step="0.01" min="0" value="' + esc(i.costo_usd || '') + '"></div>' +
    '</div>' +
    '<label class="campo"><input type="checkbox" id="i-activo" style="width:auto"' + (String(i.activo) !== '0' ? ' checked' : '') + '> Activo</label>' +
    '<div id="i-error" class="aviso aviso-error" style="display:none;margin-top:10px"></div>' +
    '<div class="modal-acciones">' +
    '<button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-primario" id="i-guardar">' + (ed ? 'Guardar cambios' : 'Crear insumo') + '</button></div>'
  );
  el('i-guardar').addEventListener('click', async function () {
    var errBox = el('i-error');
    if (errBox) { errBox.style.display = 'none'; }
    try {
      var datos = {
        codigo: (ed ? i.codigo : el('i-cod').value).trim(),
        nombre: el('i-nom').value.trim(),
        unidad: el('i-uni').value.trim() || 'unidad',
        stock: num(el('i-stock').value),
        stock_min: num(el('i-min').value),
        costo_usd: num(el('i-costo').value),
        activo: el('i-activo').checked ? 1 : 0
      };
      if (!datos.codigo || !datos.nombre) throw new Error('El código y el nombre son obligatorios.');
      await API.guardarInsumo(datos);
      toast(ed ? 'Insumo actualizado' : 'Insumo creado', 'ok');
      cerrarModal();
      await cargarInsumos();
      pintarTablaInsumos(el('ins-bus') ? el('ins-bus').value : '');
    } catch (e) {
      var M = (e && e.message) || 'No se pudo guardar.';
      if (errBox) { errBox.textContent = '⚠️ ' + M; errBox.style.display = 'block'; }
      toast(M, 'error');
    }
  });
}

function formularioStockInsumo(codigo) {
  var i = insumos().find(function (x) { return String(x.codigo) === String(codigo); });
  if (!i) { toast('Insumo no encontrado', 'error'); return; }
  abrirModal(
    '<div class="modal-tope"><h3>Ajustar stock — ' + esc(i.nombre) + '</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<p class="muted">Stock actual: <b>' + fmtCant(i.stock) + ' ' + esc(i.unidad || 'u') + '</b></p>' +
    '<label class="campo">Tipo de movimiento</label>' +
    '<select id="is-mov"><option value="1">➕ Entrada (compra)</option><option value="-1">➖ Salida (consumo/merma)</option><option value="set">🟰 Fijar stock</option></select>' +
    '<label class="campo">Cantidad</label><input id="is-cant" type="number" step="0.0001" min="0" value="">' +
    '<label class="campo">Motivo (opcional)</label><input id="is-mot" value="">' +
    '<div id="is-error" class="aviso aviso-error" style="display:none;margin-top:10px"></div>' +
    '<div class="modal-acciones">' +
    '<button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
    '<button class="btn btn-primario" id="is-guardar">Aplicar</button></div>'
  );
  el('is-guardar').addEventListener('click', async function () {
    var errBox = el('is-error');
    if (errBox) errBox.style.display = 'none';
    try {
      var mov = el('is-mov').value;
      var cant = num(el('is-cant').value);
      if (mov === 'set') {
        await API.ajustarStockInsumo(i.codigo, cant - num(i.stock), el('is-mot').value.trim() || 'ajuste manual');
      } else {
        if (cant <= 0) throw new Error('Indica una cantidad mayor que cero.');
        await API.ajustarStockInsumo(i.codigo, num(mov) * cant, el('is-mot').value.trim() || 'ajuste manual');
      }
      toast('Stock ajustado', 'ok');
      cerrarModal();
      await cargarInsumos();
      pintarTablaInsumos(el('ins-bus') ? el('ins-bus').value : '');
    } catch (e) {
      var M = (e && e.message) || 'No se pudo ajustar.';
      if (errBox) { errBox.textContent = '⚠️ ' + M; errBox.style.display = 'block'; }
      toast(M, 'error');
    }
  });
}

var _pedTimer = null;
function pararAutoPedidos() { if (_pedTimer) { clearInterval(_pedTimer); _pedTimer = null; } }

render.pedidos = async function () {
  pintar(
    '<div class="fila-botones" style="margin:0 0 8px">' +
      '<button class="btn btn-primario" id="ped-nuevo">＋ Tomar pedido</button>' +
      '<button class="btn" id="ped-reload">↻ Recargar</button>' +
    '</div>' +
    '<p class="muted" id="ped-act" style="margin:0 0 10px">Los pedidos se muestran por orden de llegada y se actualizan solos cada 20 s. Al <b>despachar</b> se registra la venta y se descuentan los insumos (materia prima) según la receta.</p>' +
    '<div id="ped-lista"><div class="cargando">Cargando pedidos…</div></div>'
  );
  el('ped-nuevo').addEventListener('click', formularioPedido);
  el('ped-reload').addEventListener('click', function () { cargarPedidos(); toast('Pedidos recargados', 'ok'); });
  await cargarPedidos();
  pararAutoPedidos();
  _pedTimer = setInterval(function () {
    if (S.pagina === 'pedidos' && !document.hidden) cargarPedidos(true);
  }, 20000);
};

async function cargarPedidos(silencioso) {
  var cont = el('ped-lista');
  if (!cont) return;
  try {
    var lista = await API.listarPedidos();
    if (!Array.isArray(lista)) lista = [];
    pintarPedidos(lista);
  } catch (e) {
    if (!silencioso) cont.innerHTML = '<div class="tarjeta"><div class="aviso aviso-error">' + esc((e && e.message) || 'No se pudieron cargar los pedidos.') + '</div></div>';
  }
}

function pintarPedidos(lista) {
  var cont = el('ped-lista');
  if (!cont) return;
  if (!lista.length) {
    cont.innerHTML = '<div class="tarjeta muted">Todavía no hay pedidos. Cuando un cliente escanee el QR y pida, o cuando tomes un pedido, aparecerá aquí.</div>';
    return;
  }
  var pend = lista.filter(function (p) { return String(p.estado) !== 'despachado'; });
  var desp = lista.filter(function (p) { return String(p.estado) === 'despachado'; }).reverse();
  var html = '<h3 class="ped-titulo">🟡 Pendientes (' + pend.length + ')</h3>';
  html += pend.length ? pend.map(cardPedido).join('') : '<div class="tarjeta muted">No hay pedidos pendientes 🎉</div>';
  if (desp.length) {
    html += '<h3 class="ped-titulo" style="margin-top:18px">🟢 Despachados (' + desp.length + ')</h3>';
    html += desp.slice(0, 40).map(cardPedido).join('');
  }
  cont.innerHTML = html;
  Array.prototype.forEach.call(cont.querySelectorAll('[data-ped-desp]'), function (b) {
    b.addEventListener('click', async function () {
      var id = b.getAttribute('data-ped-desp');
      b.disabled = true;
      try {
        await API.marcarPedidoDespachado(id);
        toast('Despachado ✅ · venta registrada y stock de insumos descontado', 'ok');
        await cargarPedidos();
      } catch (e) { toast((e && e.message) || 'No se pudo marcar', 'error'); b.disabled = false; }
    });
  });
}

function cardPedido(p) {
  var items = [];
  try { items = JSON.parse(p.items || '[]'); } catch (e) { items = []; }
  var desp = String(p.estado) === 'despachado';
  var tipo = String(p.tipo) === 'app' ? '🛎️ Tomado en caja' : '📱 Cliente (QR)';
  var nro = String(p.numero == null ? '' : p.numero).replace(/\D/g, '');
  nro = nro ? ('0000' + nro).slice(-4) : String(p.numero || '');
  return '<div class="ped-card' + (desp ? ' des' : '') + '">' +
    '<div class="ped-cab">' +
      '<span class="ped-num">#' + esc(nro) + '</span>' +
      '<span class="ped-cli">' + esc(p.cliente_nombre || 'Cliente') + (p.cliente_telefono ? ' · ' + esc(p.cliente_telefono) : '') + '</span>' +
      '<span class="ped-estado ' + (desp ? 'ok' : 'pend') + '">' + (desp ? '🟢 Despachado' : '🟡 Pendiente') + '</span>' +
    '</div>' +
    '<div class="ped-tipo muted">' + tipo + ' · ' + fechaHora(p.creado_el) + '</div>' +
    '<div class="ped-tags">' +
      '<span class="ped-tag">' + (String(p.modalidad) === 'comer' ? '🍽️ Comer aquí' : '🛍️ Para llevar') + '</span>' +
      '<span class="ped-tag' + (String(p.metodo_pago) === 'divisas' ? ' div' : ' pm') + '">' +
        (String(p.metodo_pago) === 'divisas' ? '💵 Divisas' : '📲 Pago Móvil') +
        (p.referencia && String(p.metodo_pago) !== 'divisas' ? ' · Ref: ' + esc(p.referencia) : '') +
      '</span>' +
    '</div>' +
    '<div class="ped-items">' + (items.length ? items.map(function (it) {
      var tp = (it.topes_incluidos || []).concat(it.topes_adicionales || []).map(function (t) { return t.nombre; }).filter(Boolean);
      var tpTxt = tp.length ? '<div class="muted" style="font-size:12px;padding-left:14px">🍫 ' + esc(tp.join(', ')) + '</div>' : '';
      return '<div class="ped-linea"><span>' + fmtCant(it.cantidad) + '× ' + esc(it.nombre || '') + '</span><span class="mono">' + fmtUSD(it.sub_usd) + '</span></div>' + tpTxt;
    }).join('') : '<i class="muted">Sin detalle</i>') + '</div>' +
    (p.nota ? '<div class="ped-nota muted">📝 ' + esc(p.nota) + '</div>' : '') +
    '<div class="ped-pie">' +
      '<span class="ped-tot">' + fmtUSD(p.total_usd) + ' <small class="muted">/ ' + fmtVES(p.total_ves) + '</small></span>' +
      (desp
        ? '<span class="muted" style="font-size:12px">Entregado ' + (p.entregado_el ? fechaHora(p.entregado_el) : '') + '</span>'
        : '<button class="btn btn-primario" data-ped-desp="' + esc(p.id) + '">✓ Despachar (venta)</button>') +
    '</div>' +
  '</div>';
}

/* ---------- Tomar un pedido desde la app (empleado o admin) ---------- */
var _pedCarrito = [];
var _pedDisp = null; // codigo -> unidades disponibles ahora (o null = sin límite)
function lineaPedKey(cod, topes) {
  return String(cod) + '|' + (topes || []).slice().sort().join(',');
}
async function formularioPedido() {
  _pedCarrito = [];
  if (!prods().length) {
    toast('Cargando productos…', 'ok');
    await cargarProductos();
  }
  try { if (!toppings().length) await cargarToppings(); } catch (e) {}
  try { _pedDisp = (await API.getDisponibilidad()) || {}; } catch (e) { _pedDisp = null; }
  abrirModal(
    '<div class="modal-tope"><h3>🛎️ Tomar pedido</h3><button class="btn-icono" onclick="cerrarModal()">✕</button></div>' +
    '<label class="campo">Nombre del cliente *</label><input id="pedc-nom" placeholder="ej: Ana · mesa 3 · para llevar" autocomplete="off">' +
    '<label class="campo">Teléfono (opcional)</label><input id="pedc-tel" inputmode="tel" autocomplete="off">' +
    '<label class="campo">¿Para llevar o comer aquí?</label>' +
    '<div class="seg" id="pedc-modo">' +
      '<button type="button" class="seg-btn on" data-modo="llevar">🛍️ Para llevar</button>' +
      '<button type="button" class="seg-btn" data-modo="comer">🍽️ Comer aquí</button>' +
    '</div>' +
    '<label class="campo">Método de pago</label>' +
    '<div class="pago-fila">' +
      '<span class="pago-lbl on" id="pedc-pm-lbl">📲 Pago Móvil</span>' +
      '<label class="switch"><input type="checkbox" id="pedc-pago-sw" checked><span class="sw"></span></label>' +
      '<span class="pago-lbl" id="pedc-div-lbl">💵 Divisas</span>' +
    '</div>' +
    '<div id="pedc-ref-caja">' +
      '<label class="campo">Referencia del Pago Móvil *</label>' +
      '<input id="pedc-ref" inputmode="numeric" placeholder="ej: 123456789" autocomplete="off">' +
    '</div>' +
    '<label class="campo">Agregar productos</label>' +
    '<div class="buscador"><input id="pedc-bus" placeholder="Buscar por nombre o código…" autocomplete="off"></div>' +
    '<div id="pedc-lista" class="pedc-lista"></div>' +
    '<div id="pedc-carro" class="pedc-carro"></div>' +
    '<label class="campo">Nota (opcional)</label><input id="pedc-nota" placeholder="ej: sin arequipe" autocomplete="off">' +
    '<div id="pedc-error" class="aviso aviso-error" style="display:none;margin-top:10px"></div>' +
    '<div class="modal-acciones">' +
      '<button class="btn btn-suave" onclick="cerrarModal()">Cancelar</button>' +
      '<button class="btn" id="pedc-go">Registrar pedido (pendiente)</button>' +
      '<button class="btn btn-primario" id="pedc-go-desp">✓ Cobrar y despachar</button>' +
    '</div>'
  );
  var _pedModo = 'llevar', _pedPago = 'pago_movil';
  Array.prototype.forEach.call(document.querySelectorAll('#pedc-modo .seg-btn'), function (b) {
    b.addEventListener('click', function () {
      Array.prototype.forEach.call(document.querySelectorAll('#pedc-modo .seg-btn'), function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      _pedModo = b.getAttribute('data-modo');
    });
  });
  var _swP = el('pedc-pago-sw');
  function refrescarPagoPed() {
    _pedPago = _swP.checked ? 'pago_movil' : 'divisas';
    var caja = el('pedc-ref-caja');
    if (_pedPago === 'pago_movil') { caja.style.display = ''; el('pedc-ref').disabled = false; }
    else { caja.style.display = 'none'; el('pedc-ref').disabled = true; }
    el('pedc-pm-lbl').classList.toggle('on', _pedPago === 'pago_movil');
    el('pedc-div-lbl').classList.toggle('on', _pedPago === 'divisas');
  }
  _swP.addEventListener('change', refrescarPagoPed);
  refrescarPagoPed();
  function dispDe(cod) {
    if (!_pedDisp || !Object.prototype.hasOwnProperty.call(_pedDisp, String(cod))) return null;
    return _pedDisp[String(cod)];
  }
  function enCarro(cod) {
    return _pedCarrito.reduce(function (s, l) { return s + (String(l.codigo) === String(cod) ? l.cantidad : 0); }, 0);
  }
  function restante(cod) {
    var d = dispDe(cod);
    if (d === null) return Infinity;
    return Math.max(0, d - enCarro(cod));
  }
  function pintarLista() {
    var q = (el('pedc-bus').value || '').trim().toLowerCase();
    var list = prods().filter(function (p) {
      return String(p.activo) === '1' && (!q || String(p.nombre).toLowerCase().indexOf(q) >= 0 || String(p.codigo).toLowerCase().indexOf(q) >= 0);
    }).slice(0, 24);
    var box = el('pedc-lista');
    box.innerHTML = list.map(function (p) {
      var d = dispDe(p.codigo);
      var disp = '';
      if (d !== null) {
        disp = d <= 0
          ? ' · <span class="baja">agotado</span>'
          : (d <= 5 ? ' · <span class="baja">quedan ' + d + '</span>' : ' · <span class="muted">quedan ' + d + '</span>');
      }
      var puede = restante(p.codigo) > 0;
      return '<div class="pedc-item">' +
        '<div class="pi-nom"><span class="prod-emoji">' + emojiDeProducto(p) + '</span>' + esc(p.nombre) + '</div>' +
        '<div class="pi-precio mono">' + fmtUSD(p.precio_usd) + disp + '</div>' +
        '<button class="btn btn-suave" data-add="' + esc(p.codigo) + '"' + (puede ? '' : ' disabled') + '>＋</button>' +
      '</div>';
    }).join('') || '<p class="muted">Sin productos.</p>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-add]'), function (b) {
      b.addEventListener('click', function () { agregarAlPedido(b.getAttribute('data-add')); });
    });
  }
  function pintarCarro() {
    var box = el('pedc-carro');
    if (!_pedCarrito.length) { box.innerHTML = '<p class="muted" style="margin:6px 0">Aún no has agregado productos.</p>'; return; }
    var tot = _pedCarrito.reduce(function (s, l) { return s + (l.precio_usd + totalExtrasToppings(l.topes)) * l.cantidad; }, 0);
    box.innerHTML = _pedCarrito.map(function (l, i) {
      var extras = totalExtrasToppings(l.topes);
      var topesTxt = l.topes.length
        ? '<div class="muted" style="font-size:12px">🍫 ' + esc(nombresToppings(l.topes)) + (extras ? ' · +' + fmtUSD(extras) + '/u' : '') + '</div>'
        : '';
      return '<div class="pedc-linea" style="flex-wrap:wrap">' +
        '<span class="pl-nom">' + esc(l.nombre) + topesTxt + '</span>' +
        '<span class="cnt"><button class="cnt-btn" data-pp="-1" data-i="' + i + '">−</button>' +
        '<span>' + fmtCant(l.cantidad) + '</span>' +
        '<button class="cnt-btn" data-pp="1" data-i="' + i + '">+</button></span>' +
        '<button class="btn btn-suave" data-top="' + i + '" type="button" title="Elegir topes">🍫</button>' +
        '<span class="mono der" style="min-width:70px">' + fmtUSD((l.precio_usd + extras) * l.cantidad) + '</span>' +
      '</div>';
    }).join('') +
    '<div class="pedc-total">Total: <b>' + fmtUSD(tot) + '</b> <small class="muted">/ ' + fmtVES(tot * (S.tasa || 0)) + '</small></div>';
    Array.prototype.forEach.call(box.querySelectorAll('[data-pp]'), function (b) {
      b.addEventListener('click', function () {
        var i = num(b.getAttribute('data-i'));
        var d = num(b.getAttribute('data-pp'));
        if (!_pedCarrito[i]) return;
        if (d > 0 && restante(_pedCarrito[i].codigo) <= 0) {
          toast('No hay más «' + _pedCarrito[i].nombre + '» disponibles', 'error');
          return;
        }
        _pedCarrito[i].cantidad += d;
        if (_pedCarrito[i].cantidad <= 0) _pedCarrito.splice(i, 1);
        pintarCarro(); pintarLista();
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll('[data-top]'), function (b) {
      b.addEventListener('click', function () {
        var l = _pedCarrito[num(b.getAttribute('data-top'))];
        if (!l) return;
        var p = prods().find(function (x) { return String(x.codigo) === String(l.codigo); });
        if (!p) return;
        elegirTopes(p, l.topes, function (sel) {
          l.topes = sel;
          var nuevokey = lineaPedKey(l.codigo, sel);
          for (var j = _pedCarrito.length - 1; j >= 0; j--) {
            if (_pedCarrito[j] !== l && _pedCarrito[j].key === nuevokey) {
              l.cantidad += _pedCarrito[j].cantidad;
              _pedCarrito.splice(j, 1);
            }
          }
          l.key = nuevokey;
          pintarCarro();
        });
      });
    });
  }
  function agregarLinea(p, topes) {
    var rest = restante(p.codigo);
    if (rest <= 0) {
      var d = dispDe(p.codigo);
      toast('No hay más «' + p.nombre + '» disponibles' + (d === null ? '' : ' (quedan ' + Math.max(0, d) + ')'), 'error');
      return;
    }
    var key = lineaPedKey(p.codigo, topes);
    var l = _pedCarrito.find(function (x) { return x.key === key; });
    if (l) l.cantidad += 1;
    else _pedCarrito.push({ key: key, codigo: p.codigo, nombre: p.nombre, precio_usd: num(p.precio_usd), cantidad: 1, topes: (topes || []).slice() });
    pintarCarro(); pintarLista();
  }
  function agregarAlPedido(cod) {
    var p = prods().find(function (x) { return String(x.codigo) === cod; });
    if (!p) return;
    var info = topesDisponibles(p);
    if (info.incluidos.length || info.adicionales.length) {
      elegirTopes(p, [], function (sel) { agregarLinea(p, sel); });
    } else {
      agregarLinea(p, []);
    }
  }
  el('pedc-bus').addEventListener('input', pintarLista);
  async function registrarPedido(despachar) {
    var err = el('pedc-error'); err.style.display = 'none';
    var nom = (el('pedc-nom').value || '').trim();
    if (!nom) { err.textContent = 'Escribe el nombre del cliente.'; err.style.display = 'block'; return; }
    if (_pedPago === 'pago_movil' && !(el('pedc-ref').value || '').trim()) { err.textContent = 'Escribe la referencia del Pago Móvil (o cambia a Divisas).'; err.style.display = 'block'; return; }
    if (!_pedCarrito.length) { err.textContent = 'Agrega al menos un producto.'; err.style.display = 'block'; return; }
    var btn = despachar ? el('pedc-go-desp') : el('pedc-go');
    var otro = despachar ? el('pedc-go') : el('pedc-go-desp');
    btn.disabled = true; if (otro) otro.disabled = true;
    try {
      var r = await API.crearPedidoManual({
        cliente: { nombre: nom, telefono: (el('pedc-tel').value || '').trim() },
        nota: (el('pedc-nota').value || '').trim(),
        modalidad: _pedModo,
        metodo_pago: _pedPago,
        referencia: (_pedPago === 'pago_movil') ? (el('pedc-ref').value || '').trim() : '',
        items: _pedCarrito.map(function (l) { return { codigo: l.codigo, cantidad: l.cantidad, topes: l.topes || [] }; })
      });
      var id = r && r.pedido && r.pedido.id;
      var nro = (r && r.pedido && r.pedido.numero) ? r.pedido.numero : '';
      if (despachar && id) {
        await API.marcarPedidoDespachado(id);
        toast('Pedido N° ' + nro + ' despachado · venta registrada ✅', 'ok');
      } else {
        toast('Pedido registrado' + (nro ? ' — N° ' + nro : '') + ' ✅', 'ok');
      }
      cerrarModal();
      await cargarPedidos();
    } catch (e) {
      err.textContent = '⚠️ ' + ((e && e.message) || 'No se pudo registrar el pedido.');
      err.style.display = 'block';
      btn.disabled = false; if (otro) otro.disabled = false;
    }
  }
  el('pedc-go').addEventListener('click', function () { registrarPedido(false); });
  el('pedc-go-desp').addEventListener('click', function () { registrarPedido(true); });
  pintarLista();
  pintarCarro();
}

/* ---------- Arranque ---------- */
el('btn-menu').addEventListener('click', abrirGaveta);
el('btn-login').addEventListener('click', intentarLogin);
el('in-usr').addEventListener('keydown', function (e) { if (e.key === 'Enter') intentarLogin(); });
el('in-pwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') intentarLogin(); });
el('btn-salir').addEventListener('click', async function () {
  if (await confirmar('¿Cerrar sesión?')) cerrarSesionLocal();
});
iniciarApp();
</script>
